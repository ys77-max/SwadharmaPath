name: Worker

# Runs the Python worker (worker/scheduler.py) on a timer instead of an always-on host.
# See docs/sops/technical-sops.md (SOP-T4). Times are UTC; IST = UTC + 5:30.
on:
  schedule:
    - cron: "*/15 * * * *"        # polling: scoring fallback, matches, reports, notifications, library refresh
    - cron: "45 20 * * *"         # nightly, 02:15 IST: report SLA and outcome reminders
    - cron: "30 3 1 1,4,7,10 *"   # quarterly, 09:00 IST on 1 Jan/Apr/Jul/Oct: AI library refresh
  workflow_dispatch:
    inputs:
      group:
        description: Which jobs to run
        type: choice
        options: [polling, nightly, quarterly]
        default: polling

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90           # a full AI library refresh takes 15-30 minutes
    env:
      GROUP: ${{ inputs.group || (github.event.schedule == '45 20 * * *' && 'nightly') || (github.event.schedule == '30 3 1 1,4,7,10 *' && 'quarterly') || 'polling' }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://fskmeqrjtwdswaoqwjkh.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WORKER_PUBLIC_LOGS: "true"  # this repo is public: keep candidate names out of the logs
      TZ: Asia/Kolkata
    concurrency:
      group: worker-${{ inputs.group || github.event.schedule || 'polling' }}
      cancel-in-progress: false
    steps:
      - name: Check setup
        id: setup
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::SUPABASE_SERVICE_ROLE_KEY secret is not set; skipping. See SOP-T1 first go-live checklist."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.setup.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install system libraries for PDF rendering
        if: steps.setup.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core fonts-noto-core
      - name: Install worker
        if: steps.setup.outputs.ready == 'true'
        run: pip install -q -r worker/requirements.txt
      - name: Run ${{ env.GROUP }} jobs
        if: steps.setup.outputs.ready == 'true'
        working-directory: worker
        run: python scheduler.py --run "$GROUP"
